<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>מדריך טיולים חי</title>
<link rel="stylesheet" href="./style.css">
</head>
<body data-state="idle">

<div id="ambient"></div>
<video id="feed" playsinline muted hidden></video>
<div id="scrim"></div>
<div id="edge"></div>

<div id="pill" class="glass">
  <span class="ring"><span class="halo"></span><span class="core"></span></span>
  <span id="stateText">לא מחובר</span>
</div>

<div id="err" hidden></div>

<div id="log">
  <div id="hint">
    <b>לחץ על הכפתור הכחול</b>
    דבר איתו חופשי — שאל לאן ללכת או מה לאכול.<br>
    כפתור המצלמה נותן לו לראות מה שאתה רואה,<br>
    והאטב שולח לו תמונה או סרטון מהגלריה.
  </div>
</div>

<div id="controls">
  <!-- סיום -->
  <button id="end" class="gbtn end" hidden aria-label="סיים שיחה">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>

  <!-- צירוף קובץ -->
  <button id="attach" class="gbtn" disabled aria-label="צרף תמונה או סרטון">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 1 1 5.18 5.18l-9.2 9.2a1.83 1.83 0 1 1-2.59-2.59l8.49-8.48"/>
    </svg>
  </button>

  <!-- התחלה -->
  <button id="start" class="gbtn" aria-label="התחל שיחה">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
    </svg>
  </button>

  <!-- מיוט -->
  <button id="mute" class="gbtn" hidden aria-pressed="false" aria-label="השתק מיקרופון">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
    </svg>
  </button>

  <!-- מצלמה -->
  <button id="camera" class="gbtn" aria-pressed="false" aria-label="הדלק מצלמה">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </button>

  <!-- היפוך מצלמה -->
  <button id="flip" class="gbtn" hidden aria-label="הפוך מצלמה">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2v6h-6M3 22v-6h6"/>
      <path d="M21 8a9 9 0 0 0-15-3L3 8M3 16a9 9 0 0 0 15 3l3-3"/>
    </svg>
  </button>
</div>

<input id="file" type="file" accept="image/*,video/*" hidden>

<script type="module" src="./app.js"></script>
</body>
</html>
